# ============================================================================
# 苍穹外卖 · 全套服务编排（管理端前端 + Web 用户端 + 后端 + MySQL + Redis）
#
# 使用位置：本文件与 .env、nginx/default.conf 放在同一目录。
#   本机对应前端仓库的 deploy/ 目录；服务器上对应 /opt/sky-deploy/。
#   与本文件同目录的 .env 会被自动读取：既用于下面 ${...} 的变量插值，
#   也通过 env_file 注入容器，因此任何 compose 命令都不需要额外加 --env-file 参数。
#
# 本文件【只写 image:，不写 build:】：
#   后端镜像在另一个 git 仓库里单独构建，前端镜像在本仓库构建，
#   两边的产物都先 docker load 到服务器上，再由本文件引用。
#   这样本文件是一份「纯启动清单」，可整体复制到服务器，与源码仓库无关。
#   镜像 tag 用语义化版本，每次重建递增、不复用旧值。
#
# 注意：不写 version: 字段（compose v2 已废弃它）。
# ============================================================================

services:

  # ---------- 数据库：不发布端口，数据落在具名卷 ----------
  sky-takeout-mysql:
    image: mysql:8.0
    container_name: sky-takeout-mysql
    restart: unless-stopped
    # 时区与字符集：与后端 JDBC URL 里的 serverTimezone=Asia/Shanghai 对齐，
    # 避免统计报表按 UTC 计算而差 8 小时。
    command:
      - --default-time-zone=+08:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    env_file: .env                     # 提供 MYSQL_ROOT_PASSWORD / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD / TZ
    volumes:
      - sky-takeout-mysql-data:/var/lib/mysql   # 具名卷：容器重建不丢数据（docker compose down -v 会删掉它，危险）
    healthcheck:
      # $$ 是 compose 的转义写法：容器里实际看到的是 $MYSQL_ROOT_PASSWORD
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s                # 首次启动要初始化数据目录，给足冷启动时间
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [sky-takeout-net]

  # ---------- 缓存：不发布端口，带访问口令 ----------
  sky-takeout-redis:
    image: redis:7-alpine
    container_name: sky-takeout-redis
    restart: unless-stopped
    # :? 语法 = 变量缺失时 compose 直接报错退出，避免「静默起了一个无口令的 Redis」。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 .env 里设置 REDIS_PASSWORD}"]
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [sky-takeout-net]

  # ---------- 后端：不发布端口，等数据库与缓存健康后再启动 ----------
  sky-takeout-backend:
    image: sky-takeout-backend:1.0.0   # 在后端仓库单独构建后 docker load 进来，tag 按语义化版本递增
    container_name: sky-takeout-backend
    restart: unless-stopped
    depends_on:
      sky-takeout-mysql: { condition: service_healthy }
      sky-takeout-redis: { condition: service_healthy }
    env_file: .env                     # 由 .env 注入全部 SKY_* 变量（后端连接与密钥配置）
    expose: ["8080"]                   # 仅在 sky-takeout-net 内可达，不映射到宿主机
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    networks: [sky-takeout-net]

  # ---------- 唯一的对外入口 ----------
  sky-takeout-frontend-admin:
    image: sky-takeout-frontend-admin:1.0.0   # 由本仓库的 deploy/Dockerfile.frontend 构建
    container_name: sky-takeout-frontend-admin
    restart: unless-stopped
    depends_on: [sky-takeout-backend]
    ports:
      - "80:80"                        # 全项目唯一发布的端口
    volumes:
      # 站点配置以只读方式挂进来：改配置只需改本机文件 + docker compose restart sky-takeout-frontend-admin，不用重建镜像。
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [sky-takeout-net]

  # ---------- Web 用户端：独立站点，自带 nginx 与 /user/ 反代，单独对外端口 ----------
  sky-takeout-frontend-user:
    image: sky-takeout-frontend-user:1.0.0   # 由 Web 用户端仓库单独构建后 docker load 进来，tag 按语义化版本递增
    container_name: sky-takeout-frontend-user
    restart: unless-stopped
    # nginx 在【启动时】解析 proxy_pass 里的主机名：后端容器必须先于本服务存在，
    # 否则本服务会以 host not found in upstream "sky-takeout-backend" 直接启动失败。
    depends_on:
      sky-takeout-backend: { condition: service_started }
    environment:
      # 站点配置是镜像内模板，容器启动时由 envsubst 渲染；这两个值就是反向代理的目标。
      BACKEND_HOST: sky-takeout-backend
      BACKEND_PORT: "8080"
    ports:
      - "8082:80"                      # 用户端站点对外端口（80 已归管理端）
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [sky-takeout-net]

volumes:
  sky-takeout-mysql-data:              # 具名卷：MySQL 数据落在这里
    name: sky-takeout-mysql-data       # 固定真实卷名：不写 name 时 Docker 会带 compose 项目名前缀，写死便于跨目录（本机 deploy/ 与服务器 /opt/sky-deploy/）一致引用

networks:
  sky-takeout-net:
    name: sky-takeout-net              # 固定真实网络名：不写 name 时会随项目名变化，写死便于跨目录一致引用、也便于其它 compose 以 external: true 接入
    driver: bridge
