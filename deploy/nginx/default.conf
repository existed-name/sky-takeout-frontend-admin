# ============================================================================
# 管理端站点配置
# 由 compose 以只读方式挂载到容器内 /etc/nginx/conf.d/default.conf
# 改完配置后：在 compose 目录执行 docker compose restart sky-takeout-frontend-admin 即可生效。
# ============================================================================

# WebSocket 升级头：非升级请求发送 "close"，避免把普通请求也误标成 upgrade。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;                 # 用公网 IP 直接访问，不绑定域名

    charset      utf-8;

    # 菜品 / 套餐图片上传会经这里转发，nginx 默认限制 1m 会直接返回 413，故放大到 20m。
    client_max_body_size 20m;

    # 静态文件的根 = 前端构建产物（Dockerfile 里 COPY 进来的 dist-sky/sky）。
    root  /usr/share/nginx/html;
    index index.html;

    # ---------- 1) 管理端前端页面（hash 路由） ----------
    location / {
        # 兜底：正常 hash 路由不会触发，但旧书签 / 旧缓存指向的怪路径可以回退到首页。
        try_files $uri $uri/ /index.html;
    }

    # 容错：有人访问裸 /api（没有结尾斜杠）时补一个斜杠，
    # 否则会落到 location / 被 try_files 兜成首页 HTML，难以排查。
    location = /api { return 301 /api/; }

    # ---------- 2) 管理端接口：/api/**  ->  后端 /admin/**（路径重写，不是透传） ----------
    location /api/ {
        # 末尾的 /admin/ 表示把匹配到的 /api/ 前缀替换成 /admin/：
        #   /api/dishes?page=1  ->  http://sky-takeout-backend:8080/admin/dishes?page=1
        # 这与开发期 vue.config.js 里的 pathRewrite {'^/api':'/admin'} 完全同构，
        # 所以前端源码无需任何改动。
        proxy_pass http://sky-takeout-backend:8080/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 导出报表是后端同步生成 Excel，链路较长，给足超时时间。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
    }

    # ---------- 3) WebSocket：/ws/**  ->  后端 /ws/**（必须带协议升级头） ----------
    location /ws/ {
        proxy_pass http://sky-takeout-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        # 后端定时心跳任务当前是关闭的（WebSocketTask 里的定时注解被注释掉了），
        # 也就是说业务消息可能几十分钟才来一条。nginx 默认 60 秒无数据就断开连接，
        # 若不显式放大超时，页面会「一切正常、但不再弹来单提醒」，现象极具迷惑性。
        # 因此这里必须把读写超时放大。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 4) 为 Web 用户端预留：接口前缀 /user/**，直通后端（不做重写） ----------
    # 用户端请求直接打到 /user/...，由反向代理原样转发到后端的 /user/**。
    location /user/ {
        # 末尾没有 URI（只有主机端口）= 原始 URI 原样透传，不做前缀替换。
        proxy_pass http://sky-takeout-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---------- 5) 为 Web 用户端预留：静态文件位置（尚未部署） ----------
    # 在用户端上线前，这里明确返回 404，避免被 location / 的 try_files 兜成管理端首页。
    location /web/ {
        try_files $uri $uri/ =404;
    }

    # 可选优化（需要时再打开）：
    # gzip on;
    # gzip_min_length 1k;
    # gzip_comp_level 5;
    # gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
